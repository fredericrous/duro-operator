# Repo-local check policy. Committed, and must be accepted once per machine
# with `amont trust` before any command here runs.

# amont:pack:start github:fredericrous/adr-lint e4d11197d32cb4711d524c6d9e3ad17e3cf2b042
pre-commit  adr-lint-check  *.rs,*.ts,*.tsx,*.mts,*.cts,*.go,*.py,adr-lint.toml,tsconfig.json,tsconfig.base.json,tsconfig.app.json,tsconfig.node.json,pyproject.toml,go.mod+.adr.yaml  warn  files adr-lint check --
pre-push  adr-lint-candidates  *.rs,*.ts,*.tsx,*.go,*.py+.adr.yaml  warn  adr-lint candidates --base default
pre-push  adr-lint-cli-probe  +adr-lint.toml  warn  heavy adr-lint cli-probe
# amont:pack:end github:fredericrous/adr-lint
# ADR-0044: this repository is at 0 exact findings, so the exact rules block here.
severity  pre-commit-adr-lint-check  block
