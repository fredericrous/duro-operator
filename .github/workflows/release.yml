name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Force bash (homelab-runner /bin/sh is dash; buildah/stable is fine either way).
defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test
    # golang:1.25 bundles go + make + gcc (the minimal homelab-runner lacks make).
    runs-on: duro-operator-ci
    container:
      image: golang:1.26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trust workspace (git safe.directory in container)
        run: git config --global --add safe.directory '*'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install dependencies
        run: |
          make controller-gen
          make envtest

      - name: Run tests
        env:
          KUBEBUILDER_ASSETS: "${{ github.workspace }}/bin/k8s/1.29.0-linux-amd64"
        run: |
          make test-unit
          make test-integration
          make test || true  # Full suite including Ginkgo

  build:
    name: Build & push image
    needs: test
    runs-on: duro-operator-ci
    permissions:
      contents: read
      packages: write
    container:
      image: quay.io/buildah/stable
    outputs:
      version_img: ${{ steps.ver.outputs.version_img }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version_img=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Buildah build + push (version, major.minor, latest)
        env:
          REG_USER: ${{ github.actor }}
          REG_PASS: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.ver.outputs.version_img }}
        run: |
          set -euo pipefail
          IMG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          MM=$(echo "$V" | awk -F. '{print $1"."$2}')
          buildah bud --storage-driver=vfs \
            -t "$IMG:$V" -t "$IMG:$MM" -t "$IMG:latest" .
          buildah login -u "$REG_USER" -p "$REG_PASS" ghcr.io
          for t in "$V" "$MM" latest; do
            buildah push --storage-driver=vfs "$IMG:$t"
          done

  release:
    name: Release
    needs: build
    runs-on: duro-operator
    permissions:
      contents: write
      packages: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: release_notes
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION_IMG=${VERSION#v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION_IMG=$VERSION_IMG" >> $GITHUB_OUTPUT

          PREV_TAG=$(git describe --tags --abbrev=0 $VERSION^ 2>/dev/null || echo "")

          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s" $PREV_TAG..$VERSION)
          else
            COMMITS=$(git log --pretty=format:"- %s")
          fi

          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)

          cat > release-notes.md << EOF
          ## ${REPO_NAME} $VERSION

          ### Docker Image
          \`\`\`bash
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$VERSION_IMG
          \`\`\`

          ### Installation
          \`\`\`bash
          helm repo add fredericrous https://fredericrous.github.io/charts
          helm repo update
          helm install ${REPO_NAME} fredericrous/${REPO_NAME}
          \`\`\`

          ### What's Changed
          $COMMITS

          ### Full Changelog
          ${PREV_TAG:+https://github.com/${{ github.repository }}/compare/$PREV_TAG...$VERSION}
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
          generate_release_notes: true

      - name: Bump Chart.yaml in source repo
        run: |
          VERSION="${{ steps.release_notes.outputs.VERSION_IMG }}"
          REPO_NAME=$(basename "${{ github.repository }}")
          CHART_PATH="chart/${REPO_NAME}/Chart.yaml"
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B main origin/main

            CURRENT=$(grep '^version:' "$CHART_PATH" | awk '{print $2}')
            if [ "$CURRENT" = "$VERSION" ]; then
              echo "Chart.yaml already at $VERSION on main, nothing to do"
              exit 0
            fi

            sed -i "s/^version: .*/version: $VERSION/" "$CHART_PATH"
            sed -i "s/^appVersion: .*/appVersion: $VERSION/" "$CHART_PATH"
            git add "$CHART_PATH"
            git commit -m "chore: bump chart to $VERSION [skip ci]"

            if git push origin main; then
              echo "Pushed chart bump on attempt $attempt"
              exit 0
            fi

            echo "Push rejected on attempt $attempt — main moved. Re-fetching and retrying..."
            sleep $((RANDOM % 5 + 1))
          done

          echo "::error::Could not push chart bump after 5 attempts — main is heavily contended"
          exit 1

      - name: Trigger Helm Chart Update
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.release_notes.outputs.VERSION_IMG }}"
          echo "Triggering Helm chart update for version ${VERSION}..."
          gh workflow run update-helm-chart.yaml \
            --field version="${VERSION}"
          echo "Successfully triggered Helm chart update for version ${VERSION}"

  security-scan:
    name: Security Scan
    needs: release
    runs-on: duro-operator
    permissions:
      security-events: write
    steps:
      - name: Extract version
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Wait for image to be available
        run: |
          echo "Waiting for image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }} to be available..."
          for i in {1..30}; do
            if docker manifest inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }} > /dev/null 2>&1; then
              echo "Image is available!"
              break
            fi
            echo "Attempt $i/30: Image not yet available, waiting 10 seconds..."
            sleep 10
          done

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
