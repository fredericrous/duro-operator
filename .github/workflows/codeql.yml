name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '30 5 * * 1'  # Every Monday at 5:30 AM

permissions:
  actions: read
  contents: read
  security-events: write

defaults:
  run:
    shell: bash

jobs:
  analyze:
    name: Analyze
    # golang:1.25 bundles go + make + gcc (the minimal homelab-runner lacks make).
    runs-on: duro-operator-ci
    container:
      image: golang:1.25
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        language: [ 'go' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Trust workspace (git safe.directory in container)
      run: git config --global --add safe.directory '*'

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        queries: security-extended,security-and-quality

    - name: Build
      run: |
        make build

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
