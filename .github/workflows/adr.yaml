name: ADR

# A separate workflow rather than a job in ci.yaml, deliberately. This job's
# `GREENTOPO_VERSION` changes on every greentopo release, and the main CI has suites of
# its own to pay for. Keeping the ADR check apart means a pin bump costs
# seconds and queues nothing else.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  adr:
    name: architecture decisions resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # The local gate reports a GAP rather than blocking when the binary is
      # absent, which is correct — a command that never ran has judged nothing.
      # That is why this job is not redundant: a contributor without `greentopo`
      # installed is waved through locally and must still be unable to merge a
      # corpus that no longer resolves.
      - name: Ensure greentopo
        env:
          GREENTOPO_VERSION: 2.0.0
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The baked binary is an optimisation, not the pin. Accepting whatever
          # the runner image happens to carry meant a version bump was silently
          # ignored until the image rebuilt — which is how a 0.3.1 pin once ran
          # 0.2.0 and reported the projection stale.
          have=""
          if command -v greentopo > /dev/null 2>&1; then
            have="$(greentopo --version 2>/dev/null | awk '{print $2}')"
          fi
          if [ "$have" = "$GREENTOPO_VERSION" ]; then
            greentopo --version
            exit 0
          fi
          echo "::warning::runner carries greentopo ${have:-none}, this repository pins ${GREENTOPO_VERSION} — downloading it"
          mkdir -p "$RUNNER_TEMP/bin"
          # Through the API (`gh release download`), not the public download URL:
          # that route throttles anonymous downloads, and it returned 504 for hours
          # on 2026-11-08 while the API served the same files.
          asset="greentopo-${GREENTOPO_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          for attempt in 1 2 3; do
            rc=0
            timeout 120 gh release download "v${GREENTOPO_VERSION}" --repo greenharness/greentopo \
              --pattern "$asset" -O "$RUNNER_TEMP/$asset" --clobber || rc=$?
            [ "$rc" = 0 ] && break
            if [ "$attempt" = 3 ]; then
              echo "::error::could not download $asset from greenharness/greentopo v${GREENTOPO_VERSION} (exit $rc; 124 = timed out after 120 s)"
              exit 1
            fi
            sleep $((attempt * 5))
          done
          tar xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/bin" --strip-components=1 \
            "greentopo-${GREENTOPO_VERSION}-x86_64-unknown-linux-gnu/greentopo"
          chmod +x "$RUNNER_TEMP/bin/greentopo"
          # GITHUB_PATH applies to LATER steps only.
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/greentopo" --version

      # This repository keeps no records of its own: every decision it answers
      # from is vendored. What this proves is that the vendored pack still
      # parses and that nothing here contradicts it.
      - name: greentopo check
        run: greentopo check

      # The areas above are a reviewed declaration of which parts of this
      # repository are a command line or a UI; they decide which fleet rules
      # the session hook shows. This says when a package stops matching them
      # (exit 1) or could not be inspected (exit 3). Detection is advisory: a
      # false positive belongs under `disclaims:` in .adr.yaml.
      - name: The declared areas still describe the repository
        run: greentopo traits --check

      # A stale `.claude/hooks/greentopo-heads.sh` injects last release's preamble
      # into every session and nothing else would say so.
      - name: The session hook is wired and current
        run: greentopo hook install --check

      # The architecture contract in greenspotter.toml (ADR-0056). The local gate
      # blocks a commit that breaks it; this runs it again on every tracked Go
      # file, so a contributor without greenspotter cannot merge a break. Both
      # tools are pinned by checksum: greenspotter refuses any ast-grep other
      # than the version it was built against.
      - name: Ensure greenspotter and ast-grep
        env:
          GH_TOKEN: ${{ github.token }}
          GREENSPOTTER: "0.15.0"
          GREENSPOTTER_SHA256: 257da35a72c0f3a157f84526b25ba94c71a69381d92be7e2caa7dd3e2b0e8b36
          AST_GREP: "0.51.0"
          AST_GREP_SHA256: a7eead5552d3a8daad70f5d50d935da44bd0c138e946b5b0a96b1d38169fa639
        run: |
          set -euo pipefail
          name="greenspotter-$GREENSPOTTER-x86_64-unknown-linux-gnu"
          # Through the API, not the web route, which throttles anonymous downloads (504s on 2026-11-08).
          for attempt in 1 2 3; do
            rc=0
            timeout 120 gh release download "v$GREENSPOTTER" --repo greenharness/greenspotter \
              --pattern "$name.tar.gz" -O "$RUNNER_TEMP/$name.tar.gz" --clobber || rc=$?
            [ "$rc" = 0 ] && break
            if [ "$attempt" = 3 ]; then
              echo "::error::could not download $name.tar.gz from greenharness/greenspotter v$GREENSPOTTER (exit $rc; 124 = timed out after 120 s)"
              exit 1
            fi
            sleep $((attempt * 5))
          done
          echo "$GREENSPOTTER_SHA256  $RUNNER_TEMP/$name.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP"
          # Through the API, not the web route, which throttles anonymous downloads (504s on 2026-11-08).
          for attempt in 1 2 3; do
            rc=0
            timeout 120 gh release download "$AST_GREP" --repo ast-grep/ast-grep \
              --pattern "app-x86_64-unknown-linux-gnu.zip" -O "$RUNNER_TEMP/ast-grep.zip" --clobber || rc=$?
            [ "$rc" = 0 ] && break
            if [ "$attempt" = 3 ]; then
              echo "::error::could not download app-x86_64-unknown-linux-gnu.zip from ast-grep/ast-grep $AST_GREP (exit $rc; 124 = timed out after 120 s)"
              exit 1
            fi
            sleep $((attempt * 5))
          done
          echo "$AST_GREP_SHA256  $RUNNER_TEMP/ast-grep.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/tools"
          unzip -q -o "$RUNNER_TEMP/ast-grep.zip" ast-grep -d "$RUNNER_TEMP/tools"
          install -m 0755 "$RUNNER_TEMP/$name/greenspotter" "$RUNNER_TEMP/tools/greenspotter"
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"
          # The checksums fix the files; the versions are compared too, so a
          # pin bump that forgets one of the two fails here, not later.
          "$RUNNER_TEMP/tools/greenspotter" --version | grep -qx "greenspotter $GREENSPOTTER"
          "$RUNNER_TEMP/tools/ast-grep" --version | grep -qx "ast-grep $AST_GREP"
          "$RUNNER_TEMP/tools/greenspotter" --version
          "$RUNNER_TEMP/tools/ast-grep" --version

      - name: The architecture contract holds
        run: |
          set -euo pipefail
          greenspotter layers summary
          git ls-files -z '*.go' | xargs -0 greenspotter check --
