name: ADR

# A separate workflow rather than a job in ci.yaml, deliberately. This job's
# `AVAL_VERSION` changes on every aval release, and the main CI has suites of
# its own to pay for. Keeping the ADR check apart means a pin bump costs
# seconds and queues nothing else.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  adr:
    name: architecture decisions resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # The local gate reports a GAP rather than blocking when the binary is
      # absent, which is correct — a command that never ran has judged nothing.
      # That is why this job is not redundant: a contributor without `aval`
      # installed is waved through locally and must still be unable to merge a
      # corpus that no longer resolves.
      - name: Ensure aval
        env:
          AVAL_VERSION: 1.12.0
        run: |
          set -euo pipefail
          # The baked binary is an optimisation, not the pin. Accepting whatever
          # the runner image happens to carry meant a version bump was silently
          # ignored until the image rebuilt — which is how a 0.3.1 pin once ran
          # 0.2.0 and reported the projection stale.
          have=""
          if command -v aval > /dev/null 2>&1; then
            have="$(aval --version 2>/dev/null | awk '{print $2}')"
          fi
          if [ "$have" = "$AVAL_VERSION" ]; then
            aval --version
            exit 0
          fi
          echo "::warning::runner carries aval ${have:-none}, this repository pins ${AVAL_VERSION} — downloading it"
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors \
            "https://github.com/fredericrous/aval/releases/download/v${AVAL_VERSION}/aval-${AVAL_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C "$RUNNER_TEMP/bin" --strip-components=1 \
                "aval-${AVAL_VERSION}-x86_64-unknown-linux-gnu/aval"
          chmod +x "$RUNNER_TEMP/bin/aval"
          # GITHUB_PATH applies to LATER steps only.
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/aval" --version

      # This repository keeps no records of its own: every decision it answers
      # from is vendored. What this proves is that the vendored pack still
      # parses and that nothing here contradicts it.
      - name: aval check
        run: aval check

      # The areas above are a reviewed declaration of which parts of this
      # repository are a command line or a UI; they decide which fleet rules
      # the session hook shows. This says when a package stops matching them
      # (exit 1) or could not be inspected (exit 3). Detection is advisory: a
      # false positive belongs under `disclaims:` in .adr.yaml.
      - name: The declared areas still describe the repository
        run: aval traits --check

      # A stale `.claude/hooks/aval-heads.sh` injects last release's preamble
      # into every session and nothing else would say so.
      - name: The session hook is wired and current
        run: aval hook install --check

      # The architecture contract in adr-lint.toml (ADR-0056). The local gate
      # blocks a commit that breaks it; this runs it again on every tracked Go
      # file, so a contributor without adr-lint cannot merge a break. Both
      # tools are pinned by checksum: adr-lint refuses any ast-grep other
      # than the version it was built against.
      - name: Ensure adr-lint and ast-grep
        env:
          ADR_LINT: "0.15.0"
          ADR_LINT_SHA256: 257da35a72c0f3a157f84526b25ba94c71a69381d92be7e2caa7dd3e2b0e8b36
          AST_GREP: "0.51.0"
          AST_GREP_SHA256: a7eead5552d3a8daad70f5d50d935da44bd0c138e946b5b0a96b1d38169fa639
        run: |
          set -euo pipefail
          name="adr-lint-$ADR_LINT-x86_64-unknown-linux-gnu"
          curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors --max-time 60 -o "$RUNNER_TEMP/$name.tar.gz" \
            "https://github.com/fredericrous/adr-lint/releases/download/v$ADR_LINT/$name.tar.gz"
          echo "$ADR_LINT_SHA256  $RUNNER_TEMP/$name.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP"
          curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors --max-time 120 -o "$RUNNER_TEMP/ast-grep.zip" \
            "https://github.com/ast-grep/ast-grep/releases/download/$AST_GREP/app-x86_64-unknown-linux-gnu.zip"
          echo "$AST_GREP_SHA256  $RUNNER_TEMP/ast-grep.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/tools"
          unzip -q -o "$RUNNER_TEMP/ast-grep.zip" ast-grep -d "$RUNNER_TEMP/tools"
          install -m 0755 "$RUNNER_TEMP/$name/adr-lint" "$RUNNER_TEMP/tools/adr-lint"
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"
          # The checksums fix the files; the versions are compared too, so a
          # pin bump that forgets one of the two fails here, not later.
          "$RUNNER_TEMP/tools/adr-lint" --version | grep -qx "adr-lint $ADR_LINT"
          "$RUNNER_TEMP/tools/ast-grep" --version | grep -qx "ast-grep $AST_GREP"
          "$RUNNER_TEMP/tools/adr-lint" --version
          "$RUNNER_TEMP/tools/ast-grep" --version

      - name: The architecture contract holds
        run: |
          set -euo pipefail
          adr-lint layers summary
          git ls-files -z '*.go' | xargs -0 adr-lint check --
