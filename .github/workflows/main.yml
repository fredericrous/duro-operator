name: Main Branch

on:
  push:
    branches: [ main ]

env:
  ENVTEST_K8S_VERSION: '1.29.0'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # setup-envtest@latest needs go>=1.26; the golang:1.25 container (warm in zot,
  # unlike the slow-to-pull 1.26) lets Go fetch the 1.26 toolchain from GOPROXY.
  GOTOOLCHAIN: auto

# Force bash (homelab-runner /bin/sh is dash; buildah/stable is fine either way).
defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test
    # golang:1.25 bundles go + make + gcc, which the minimal homelab-runner
    # lacks (it had `make: command not found`). Runs on the novolume scale set.
    runs-on: duro-operator-ci
    container:
      image: golang:1.25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trust workspace (git safe.directory in container)
        run: git config --global --add safe.directory '*'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Cache envtest binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/testbin
            ~/.cache/kubebuilder-envtest
            ${{ github.workspace }}/bin
          key: envtest-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ env.ENVTEST_K8S_VERSION }}
          restore-keys: |
            envtest-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            envtest-${{ runner.os }}-

      - name: Install dependencies
        run: |
          make controller-gen
          make envtest

      - name: Setup envtest environment
        run: |
          echo "KUBEBUILDER_ASSETS=$(${{ github.workspace }}/bin/setup-envtest use ${{ env.ENVTEST_K8S_VERSION }} --bin-dir ${{ github.workspace }}/bin -p path)" >> $GITHUB_ENV

      - name: Run tests
        env:
          KUBEBUILDER_CONTROLPLANE_START_TIMEOUT: 60s
          KUBEBUILDER_CONTROLPLANE_STOP_TIMEOUT: 60s
        run: |
          make test-unit

  build-and-push:
    name: Build and Push
    runs-on: duro-operator-ci
    needs: test
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    container:
      image: quay.io/buildah/stable
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Buildah build + push (main, main-<sha>, latest)
        env:
          REG_USER: ${{ github.actor }}
          REG_PASS: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IMG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          buildah bud --storage-driver=vfs \
            -t "$IMG:main" -t "$IMG:main-$SHA" -t "$IMG:latest" .
          buildah login -u "$REG_USER" -p "$REG_PASS" ghcr.io
          for t in main "main-$SHA" latest; do
            buildah push --storage-driver=vfs "$IMG:$t"
          done

  security-scan:
    runs-on: duro-operator
    needs: build-and-push
    permissions:
      security-events: write
    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
