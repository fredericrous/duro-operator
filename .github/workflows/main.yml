name: Main Branch

on:
  push:
    branches: [ main ]

env:
  ENVTEST_K8S_VERSION: '1.29.0'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # setup-envtest@latest needs go>=1.26; go.mod says 1.25, GOTOOLCHAIN=auto
  # lets Go fetch the newer toolchain from GOPROXY for that one tool.
  GOTOOLCHAIN: auto

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test
    # Hosted runners since 2026-09-21 (see pr.yml for why).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Attestation check
        id: attest
        uses: fredericrous/attest@v1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # the explicit module/build cache steps below stay in charge
          cache: false

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Cache envtest binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/testbin
            ~/.cache/kubebuilder-envtest
            ${{ github.workspace }}/bin
          key: envtest-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ env.ENVTEST_K8S_VERSION }}
          restore-keys: |
            envtest-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            envtest-${{ runner.os }}-

      - name: Install dependencies
        run: |
          make controller-gen
          make envtest

      - name: Setup envtest environment
        run: |
          echo "KUBEBUILDER_ASSETS=$(${{ github.workspace }}/bin/setup-envtest use ${{ env.ENVTEST_K8S_VERSION }} --bin-dir ${{ github.workspace }}/bin -p path)" >> $GITHUB_ENV

      - name: Run tests
        if: ${{ !contains(fromJSON(steps.attest.outputs.gates), 'pre-push-go-test') }}
        env:
          KUBEBUILDER_CONTROLPLANE_START_TIMEOUT: 60s
          KUBEBUILDER_CONTROLPLANE_STOP_TIMEOUT: 60s
        run: |
          make test-unit

  build-and-push:
    name: Build and Push
    # ubuntu-24.04 ships buildah; no job container, no vfs storage driver.
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Buildah build + push (main, main-<sha>, latest)
        env:
          REG_USER: ${{ github.actor }}
          REG_PASS: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IMG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          buildah bud \
            -t "$IMG:main" -t "$IMG:main-$SHA" -t "$IMG:latest" .
          buildah login -u "$REG_USER" -p "$REG_PASS" ghcr.io
          for t in main "main-$SHA" latest; do
            buildah push "$IMG:$t"
          done

  security-scan:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      security-events: write
    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
